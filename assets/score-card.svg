<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" aria-label="Example gtv-lor score card: overall 3.5 out of 5">
  <style>
    .t { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .lbl { font-size: 15px; fill: #334155; }
    .num { font-size: 15px; font-weight: 700; fill: #0f172a; }
    .muted { font-size: 13px; fill: #64748b; }
  </style>
  <rect x="1" y="1" width="798" height="468" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="32" y="52" class="t" font-size="14" font-weight="600" fill="#64748b">/gtv-lor-eval</text>
  <text x="32" y="96" class="t" font-size="44" font-weight="800" fill="#0f172a">3.5<tspan font-size="24" fill="#94a3b8" font-weight="600"> / 5</tspan></text>
  <rect x="180" y="66" width="168" height="34" rx="17" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="264" y="89" text-anchor="middle" class="t" font-size="15" font-weight="600" fill="#047857">Good: minor fixes</text>
  <text x="32" y="128" class="t muted">Exceptional Talent route</text>
  <rect x="520" y="66" width="248" height="34" rx="17" fill="#fef2f2" stroke="#fecaca"/>
  <text x="644" y="89" text-anchor="middle" class="t" font-size="15" font-weight="600" fill="#b91c1c">9 of 10 must-haves pass</text>
  <text x="768" y="128" text-anchor="end" class="t muted">Missing: your CV in the same PDF</text>
  <line x1="32" y1="150" x2="768" y2="150" stroke="#f1f5f9" stroke-width="2"/>

  <g class="t">
    <!-- row helper: label at x=32, bar track at x=420 width 300, score at 768 -->
    <text x="32" y="186" class="lbl">Achievements in digital tech (x2)</text>
    <rect x="420" y="174" width="300" height="14" rx="7" fill="#f1f5f9"/><rect x="420" y="174" width="240" height="14" rx="7" fill="#22c55e"/>
    <text x="768" y="186" text-anchor="end" class="num">4</text>

    <text x="32" y="222" class="lbl">Leadership and recognition (x2)</text>
    <rect x="420" y="210" width="300" height="14" rx="7" fill="#f1f5f9"/><rect x="420" y="210" width="240" height="14" rx="7" fill="#22c55e"/>
    <text x="768" y="222" text-anchor="end" class="num">4</text>

    <text x="32" y="258" class="lbl">Who the author is, how they know you</text>
    <rect x="420" y="246" width="300" height="14" rx="7" fill="#f1f5f9"/><rect x="420" y="246" width="180" height="14" rx="7" fill="#eab308"/>
    <text x="768" y="258" text-anchor="end" class="num">3</text>

    <text x="32" y="294" class="lbl">Why the UK is good for you</text>
    <rect x="420" y="282" width="300" height="14" rx="7" fill="#f1f5f9"/><rect x="420" y="282" width="180" height="14" rx="7" fill="#eab308"/>
    <text x="768" y="294" text-anchor="end" class="num">3</text>

    <text x="32" y="330" class="lbl">What you'll bring to UK tech</text>
    <rect x="420" y="318" width="300" height="14" rx="7" fill="#f1f5f9"/><rect x="420" y="318" width="120" height="14" rx="7" fill="#f97316"/>
    <text x="768" y="330" text-anchor="end" class="num">2</text>

    <text x="32" y="366" class="lbl">Future plans</text>
    <rect x="420" y="354" width="300" height="14" rx="7" fill="#f1f5f9"/><rect x="420" y="354" width="180" height="14" rx="7" fill="#eab308"/>
    <text x="768" y="366" text-anchor="end" class="num">3</text>

    <text x="32" y="402" class="lbl">Sounds like a real person</text>
    <rect x="420" y="390" width="300" height="14" rx="7" fill="#f1f5f9"/><rect x="420" y="390" width="180" height="14" rx="7" fill="#eab308"/>
    <text x="768" y="402" text-anchor="end" class="num">3</text>

    <text x="32" y="438" class="lbl">Claims match the evidence</text>
    <rect x="420" y="426" width="300" height="14" rx="7" fill="#f1f5f9"/><rect x="420" y="426" width="240" height="14" rx="7" fill="#22c55e"/>
    <text x="768" y="438" text-anchor="end" class="num">4</text>
  </g>
</svg>
