<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="Example of a letter marked up by gtv-lor-polish, with highlighted additions, crossed-out deletions and margin comments">
  <style>
    .t { font-family: Georgia, 'Times New Roman', serif; font-size: 16px; fill: #1e293b; }
    .ui { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  </style>
  <rect x="1" y="1" width="798" height="398" rx="18" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="2"/>
  <text x="32" y="40" class="ui" font-size="14" font-weight="600" fill="#64748b">/gtv-lor-polish   your letter, with suggestions as tracked changes</text>

  <!-- page -->
  <rect x="32" y="60" width="500" height="312" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="104" class="t">I have known Jane since 2022, when she</text>
  <text x="60" y="130" class="t">joined our platform team. We are co-authors</text>
  <text x="60" y="156" class="t">on a paper <tspan style="fill:#b91c1c" text-decoration="line-through">currently under review</tspan></text>
  <rect x="58" y="166" width="414" height="24" rx="3" fill="#fef08a"/>
  <text x="60" y="183" class="t" style="fill:#1d4ed8" text-decoration="underline">published in March 2026 after peer review.</text>
  <text x="60" y="222" class="t">She led the rebuild of our data platform,</text>
  <text x="60" y="248" class="t">taking it from 40k to 2M users<tspan style="fill:#b91c1c" text-decoration="line-through">, which was a</tspan></text>
  <text x="60" y="274" class="t"><tspan style="fill:#b91c1c" text-decoration="line-through">huge success</tspan><tspan style="fill:#1d4ed8" text-decoration="underline">.</tspan> She plans to build her company</text>
  <rect x="58" y="284" width="270" height="24" rx="3" fill="#fef08a"/>
  <text x="60" y="301" class="t" style="fill:#1d4ed8" text-decoration="underline">in London and hire there.</text>
  <rect x="60" y="330" width="120" height="8" rx="4" fill="#e2e8f0"/>

  <!-- comments -->
  <line x1="476" y1="178" x2="556" y2="128" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="556" y="84" width="212" height="96" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="572" y="108" class="ui" font-size="12" font-weight="700" fill="#4338ca">gtv-lor suggestion</text>
  <text x="572" y="130" class="ui" font-size="13" fill="#334155">Fact from your brief: the</text>
  <text x="572" y="148" class="ui" font-size="13" fill="#334155">paper is out now. Checkable</text>
  <text x="572" y="166" class="ui" font-size="13" fill="#334155">claims score higher.</text>

  <line x1="332" y1="296" x2="556" y2="262" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="556" y="214" width="212" height="96" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="572" y="238" class="ui" font-size="12" font-weight="700" fill="#4338ca">gtv-lor suggestion</text>
  <text x="572" y="260" class="ui" font-size="13" fill="#334155">Say what she'll do in the UK,</text>
  <text x="572" y="278" class="ui" font-size="13" fill="#334155">not just that it's great. Put it</text>
  <text x="572" y="296" class="ui" font-size="13" fill="#334155">in your own words.</text>

  <text x="556" y="352" class="ui" font-size="12" fill="#64748b">Review in Word: Accept or Reject</text>
</svg>
